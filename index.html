<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f3ef"><link rel="manifest" href="./manifest.json"><title>Learning OS</title><style>:root{--bg:#f3f3ef;--card:#fff;--ink:#171717;--muted:#777;--soft:#e7e7e2;--line:#deded8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em}.small{font-size:12px;color:var(--muted)}h1{font-size:38px;line-height:1;letter-spacing:-.04em;margin:7px 0 10px}h2{font-size:27px;margin:7px 0}.card{background:#fff;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.05)}button,input,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.primary{width:100%;border:0;border-radius:20px;padding:18px;background:#171717;color:#fff;font-weight:750;font-size:17px}.secondary{width:100%;border:0;border-radius:18px;padding:15px;background:var(--soft)}.ghost,.back{border:0;background:transparent;padding:8px 0;color:#555}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.tap{cursor:pointer}.title{font-size:20px;font-weight:760}.path{font-size:12px;color:#777;margin-top:4px}.plusrow{display:flex;gap:9px;margin-top:14px}.plusrow input{flex:1}.plusrow button{width:56px;border:0;border-radius:18px;background:#171717;color:#fff;font-size:24px}input,textarea{width:100%;border:0;background:var(--soft);border-radius:17px;padding:15px;font-size:16px;outline:none}label{display:block;font-size:12px;color:#777;margin:14px 2px 6px}.timer{font-size:62px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.045em;margin:30px 0 22px}.events{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.event{border:0;background:#fff;border-radius:20px;padding:16px 3px 12px;font-size:11px}.event b{display:block;font-size:27px;margin-bottom:4px}.count{height:13px;font-size:11px;color:#888}.pill{display:inline-block;background:var(--soft);padding:7px 10px;border-radius:999px;font-size:12px;color:#555}.tree{margin-top:12px}.node{background:#fff;border-radius:20px;padding:15px;margin:9px 0}.node .children{margin:10px 0 0 14px;padding-left:12px;border-left:2px solid #e7e7e2}.nodeLine{display:flex;justify-content:space-between;gap:10px}.badge{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:11px;color:#666}.crumb{font-size:12px;color:#777;margin-bottom:4px}.timeline .item{padding:14px 0;border-bottom:1px solid var(--line)}.timeline .item:last-child{border:0}.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}</style></head><body><div class="app"><header><div class="brand">LEARNING OS</div><div class="small" id="clock"></div></header><section id="home"><div class="small" id="greet"></div><h1>Learn.</h1><p class="muted">学べばいい。Learning OSが、何をどう学んできたかを覚える。</p><div id="activeBox"></div><div class="small" style="margin-top:26px">CONTINUE</div><div id="continueList"></div><div class="plusrow"><input id="quickArea" placeholder="新しい分野：English / AI / guitar…"><button id="quickAdd">＋</button></div><div class="card tap" id="mapCard" style="margin-top:24px"><div class="between"><div><b>Learning Map</b><div class="small">何を学んでいるか、階層で見る</div></div><div>→</div></div></div><div class="card tap" id="todayCard"><div class="between"><div><b>Today</b><div class="small" id="todaySummary"></div></div><div>→</div></div></div></section><section id="new" class="hidden"><button class="back" data-home>← Back</button><div class="small">NEW LEARNING</div><h2 id="newAreaTitle"></h2><label>分野の中のテーマ</label><input id="newThread" placeholder="例：発音 / 不規則動詞 / Reading"><label>さらに細かい内容 <span class="small">任意</span></label><input id="newSubtopic" placeholder="例：v と f の違い"><label>今日やる具体的な内容</label><textarea id="newContent" rows="4" placeholder="例：v と f の口の形と音の違いを練習する"></textarea><label>教材・位置 <span class="small">任意</span></label><input id="newPosition" placeholder="p.84 / Lesson 12 / Video 18:20"><button class="primary" id="startNew" style="margin-top:20px">▶ Start</button></section><section id="session" class="hidden"><div class="between"><div><div class="crumb" id="sPath"></div><h2 id="sHeading">Learning</h2><div class="pill" id="sPos"></div></div><button class="back" id="minimize">⌄</button></div><div class="timer" id="timer">00:00</div><label>今、何を勉強していますか？</label><textarea id="liveContent" rows="4"></textarea><button class="ghost" id="saveContent">内容を保存</button><div class="events"><button class="event" data-event="gotit"><b>💡</b>Got it<div class="count" id="c-gotit"></div></button><button class="event" data-event="confused"><b>?</b>Hmm<div class="count" id="c-confused"></div></button><button class="event" data-event="important"><b>★</b>Keep<div class="count" id="c-important"></div></button><button class="event" data-event="revisit"><b>↩</b>Later<div class="count" id="c-revisit"></div></button></div><button class="secondary" id="finishBtn" style="margin-top:22px">■ Finish</button></section><section id="finish" class="hidden"><div class="small">SESSION COMPLETE</div><h2 id="fTitle"></h2><div class="card"><div class="small">PATH</div><div id="fPath"></div><div class="small" id="fTime" style="margin-top:10px"></div></div><label>どこまで進んだ？ <span class="small">任意</span></label><input id="fPos"><label>一言だけ残す <span class="small">任意</span></label><textarea id="fOutcome" rows="3"></textarea><button class="primary" id="doneBtn" style="margin-top:20px">Done</button></section><section id="map" class="hidden"><button class="back" data-home>← Back</button><div class="small">LEARNING MAP</div><h2>What are you learning?</h2><p class="muted">分野 → テーマ → 細かい内容 → 実際の学習履歴</p><div id="tree" class="tree"></div></section><section id="today" class="hidden"><button class="back" data-home>← Back</button><div class="small">TODAY</div><h2>What changed?</h2><div id="todayList" class="timeline card"></div></section><div class="toast" id="toast"></div></div><script>(()=>{const KEY='learningOS_v2',OLD='learningOS_pwa_v1',ACTIVE='learningOS_active_v2';let data=JSON.parse(localStorage.getItem(KEY)||'{"areas":{},"sessions":[]}');if(!localStorage.getItem(KEY)){try{const old=JSON.parse(localStorage.getItem(OLD)||'null');if(old&&old.sessions){old.sessions.forEach(s=>{const area=s.topic||'Other';const x={...s,area,thread:'',subtopic:'',content:s.content||''};data.sessions.push(x);if(!data.areas[area])data.areas[area]={name:area,updated:s.end||s.start,threads:{}}});localStorage.setItem(KEY,JSON.stringify(data))}}catch(e){}}let active=JSON.parse(localStorage.getItem(ACTIVE)||'null'),pendingArea='',tick=null;const $=id=>document.getElementById(id),sections=['home','new','session','finish','map','today'];const screen=id=>sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const saveA=()=>active?localStorage.setItem(ACTIVE,JSON.stringify(active)):localStorage.removeItem(ACTIVE);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),700)}function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const h=d.getHours();$('greet').textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}clock();setInterval(clock,1000);function fmt(s){const m=Math.floor(s/60),r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}function pathOf(s){return [s.area,s.thread,s.subtopic].filter(Boolean).join(' › ')}function counts(s=active){const c={gotit:0,confused:0,important:0,revisit:0};(s?.events||[]).forEach(e=>c[e.type]++);return c}function today(){const k=new Date().toDateString();return data.sessions.filter(s=>new Date(s.start).toDateString()===k)}function register(s){const area=data.areas[s.area]||(data.areas[s.area]={name:s.area,updated:Date.now(),threads:{}});area.updated=Date.now();if(s.thread){const th=area.threads[s.thread]||(area.threads[s.thread]={name:s.thread,updated:Date.now(),subtopics:{}});th.updated=Date.now();if(s.subtopic){const sub=th.subtopics[s.subtopic]||(th.subtopics[s.subtopic]={name:s.subtopic,updated:Date.now()});sub.updated=Date.now()}}}function renderHome(){$('activeBox').innerHTML=active?`<div class="card tap" id="resumeCard"><div class="small">IN PROGRESS</div><div class="title">${esc(pathOf(active))}</div><div class="small">${esc(active.content||'Learning')}</div></div>`:'';if(active)$('resumeCard').onclick=resume;const box=$('continueList');box.innerHTML='';const recent=data.sessions.slice().sort((a,b)=>(b.end||b.start)-(a.end||a.start));const seen=new Set();recent.filter(s=>{const k=pathOf(s);if(seen.has(k))return false;seen.add(k);return true}).slice(0,5).forEach(s=>{const e=document.createElement('div');e.className='card tap';e.innerHTML=`<div class="between"><div><div class="title">${esc(s.area)}</div><div class="path">${esc([s.thread,s.subtopic].filter(Boolean).join(' › ')||s.content||'Continue')}</div></div><div>▶</div></div>`;e.onclick=()=>begin(s.area,s.thread||'',s.subtopic||'',s.content||'',s.endPosition||s.position||'');box.appendChild(e)});if(!box.children.length)box.innerHTML='<div class="card muted">下の欄から最初の学習を始めます。</div>';const a=today();$('todaySummary').textContent=a.length?`${a.length} moments · ${Math.round(a.reduce((x,s)=>x+(s.duration||0),0)/60)} min`:'Nothing yet.'}function home(){clearInterval(tick);screen('home');renderHome()}function begin(area,thread,subtopic,content,position){active={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),area,thread,subtopic,content,position,start:Date.now(),events:[]};register(active);save();saveA();resume()}function resume(){$('sPath').textContent=pathOf(active);$('sHeading').textContent=active.content||'Learning';$('sPos').textContent=active.position||'In progress';$('liveContent').value=active.content||'';screen('session');clearInterval(tick);tick=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-active.start)/1000))},1000);$('timer').textContent=fmt(Math.floor((Date.now()-active.start)/1000));renderCounts()}function renderCounts(){const c=counts();Object.keys(c).forEach(k=>$('c-'+k).textContent=c[k]||'')}function addEvent(type){active.events.push({type,time:Date.now()});saveA();renderCounts();toast(type==='gotit'?'💡':type==='confused'?'?':type==='important'?'★':'↩')}function saveContent(){active.content=$('liveContent').value.trim();$('sHeading').textContent=active.content||'Learning';saveA();toast('内容を保存')}function finish(){clearInterval(tick);active.content=$('liveContent').value.trim();active.duration=Math.max(1,Math.round((Date.now()-active.start)/1000));saveA();$('fTitle').textContent=active.area;$('fPath').textContent=pathOf(active);$('fTime').textContent=Math.max(1,Math.round(active.duration/60))+' min';$('fPos').value=active.position||'';$('fOutcome').value='';screen('finish')}function done(){active.end=Date.now();active.endPosition=$('fPos').value.trim();active.outcome=$('fOutcome').value.trim();data.sessions.push(active);register(active);save();active=null;saveA();home();toast('Remembered')}function showMap(){const tree=$('tree');tree.innerHTML='';const areas=Object.values(data.areas).sort((a,b)=>b.updated-a.updated);if(!areas.length){tree.innerHTML='<div class="card muted">まだ学習地図はありません。</div>';return screen('map')}areas.forEach(a=>{const sessionsA=data.sessions.filter(s=>s.area===a.name);let html=`<div class="node"><div class="nodeLine"><div><div class="title">${esc(a.name)}</div><div class="small">${sessionsA.length} sessions</div></div><span class="badge">AREA</span></div>`;Object.values(a.threads||{}).sort((x,y)=>y.updated-x.updated).forEach(t=>{const st=data.sessions.filter(s=>s.area===a.name&&s.thread===t.name);html+=`<div class="children"><div class="nodeLine"><div><b>${esc(t.name)}</b><div class="small">${st.length} sessions</div></div><span class="badge">THREAD</span></div>`;Object.values(t.subtopics||{}).sort((x,y)=>y.updated-x.updated).forEach(sub=>{const ss=data.sessions.filter(s=>s.area===a.name&&s.thread===t.name&&s.subtopic===sub.name);html+=`<div class="children"><div class="nodeLine"><div><b>${esc(sub.name)}</b><div class="small">${ss.length} sessions</div></div><span class="badge">TOPIC</span></div>`;ss.slice().sort((x,y)=>y.start-x.start).slice(0,4).forEach(s=>{html+=`<div class="children small">${new Date(s.start).toLocaleDateString()} · ${esc(s.content||'Learning')}</div>`});html+='</div>'});html+='</div>'});html+='</div>';tree.innerHTML+=html});screen('map')}function showToday(){const b=$('todayList'),arr=today().slice().reverse();b.innerHTML=arr.length?'':'<div class="muted">No moments yet.</div>';arr.forEach(s=>{const c=counts(s),sig=c.confused&&c.gotit?'? → 💡':c.gotit?'💡':c.confused?'?':'';b.innerHTML+=`<div class="item"><b>${esc(pathOf(s))}</b><div>${esc(s.content||'')}</div><div class="small">${Math.max(1,Math.round((s.duration||0)/60))} min ${sig?'· '+sig:''}</div></div>`});screen('today')}$('quickAdd').onclick=()=>{const a=$('quickArea').value.trim();if(!a)return;pendingArea=a;$('newAreaTitle').textContent=a;$('newThread').value='';$('newSubtopic').value='';$('newContent').value='';$('newPosition').value='';screen('new')};$('startNew').onclick=()=>begin(pendingArea,$('newThread').value.trim(),$('newSubtopic').value.trim(),$('newContent').value.trim(),$('newPosition').value.trim());$('saveContent').onclick=saveContent;$('minimize').onclick=()=>{saveContent();home()};$('finishBtn').onclick=finish;$('doneBtn').onclick=done;$('mapCard').onclick=showMap;$('todayCard').onclick=showToday;document.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>addEvent(b.dataset.event));renderHome();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();</script></body></html>
