<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3ef">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Learning OS</title>
<style>
:root{--bg:#f3f3ef;--card:#fff;--ink:#171717;--muted:#777;--soft:#e7e7e2;--line:#dfdfd9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:640px;margin:auto;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em}.small{font-size:12px;color:var(--muted)}h1{font-size:38px;line-height:1;letter-spacing:-.04em;margin:8px 0 12px}h2{font-size:27px;letter-spacing:-.025em;margin:8px 0}.card{background:#fff;border-radius:24px;padding:18px;margin:12px 0;box-shadow:0 1px 0 rgba(0,0,0,.05)}button,input,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.primary{width:100%;border:0;border-radius:20px;padding:18px;background:#171717;color:#fff;font-size:17px;font-weight:760}.secondary{width:100%;border:0;border-radius:18px;padding:15px;background:var(--soft)}.back,.ghost{border:0;background:transparent;padding:8px 0;color:#555}.topline{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}input,textarea{width:100%;border:0;background:var(--soft);border-radius:17px;padding:15px;font-size:16px;outline:none}label{display:block;font-size:12px;color:#777;margin:14px 2px 6px}.topic{font-size:20px;font-weight:760}.tap{cursor:pointer}.plusrow{display:flex;gap:9px;margin-top:14px}.plusrow input{flex:1}.plusrow button{width:56px;border:0;border-radius:18px;background:#171717;color:white;font-size:24px}.timer{font-size:62px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.045em;margin:32px 0 22px}.studybox{background:#fff;border-radius:22px;padding:16px;margin-bottom:15px}.studybox textarea{background:#f0f0ec;min-height:110px}.events{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.event{border:0;background:#fff;border-radius:20px;padding:16px 3px 12px;font-size:11px}.event b{display:block;font-size:27px;margin-bottom:4px}.count{height:13px;font-size:11px;color:#888}.pill{display:inline-block;background:var(--soft);padding:7px 10px;border-radius:999px;font-size:12px;color:#555;margin-top:6px}.timeline .item{padding:14px 0;border-bottom:1px solid var(--line)}.timeline .item:last-child{border:0}.insight{font-size:18px;line-height:1.45}.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1}
</style>
</head><body><div class="app">
<header><div class="brand">LEARNING OS</div><div class="small" id="clock"></div></header>
<section id="home"><div class="small" id="greet"></div><h1>Learn.</h1><p class="muted">学べばいい。記録はLearning OSが覚える。</p><div id="activeBox"></div><div class="small" style="margin-top:28px">CONTINUE</div><div id="topicList"></div><div class="plusrow"><input id="quickTopic" placeholder="新しい学習：English / AI / guitar…"><button id="quickAdd">＋</button></div><div class="card tap" id="todayCard" style="margin-top:24px"><div class="topline"><div><b>Today</b><div class="small" id="todaySummary"></div></div><div>→</div></div></div><button class="ghost" id="patternsBtn">Patterns & memory →</button></section>
<section id="new" class="hidden"><button class="back" data-home>← Back</button><div class="small">NEW LEARNING</div><h2 id="newTitle"></h2><label>今日の具体的な内容</label><textarea id="newContent" rows="4" placeholder="例：英文記事を読む／教科書 p.84〜87／円運動の問題12〜18"></textarea><label>教材・位置 <span class="small">任意</span></label><input id="newPosition" placeholder="p.84 / Lesson 12 / Video 18:20"><button class="primary" id="startNew" style="margin-top:20px">▶ Start</button></section>
<section id="session" class="hidden"><div class="topline"><div><div class="small" id="sTopic"></div><h2 id="sHeading">Learning</h2><div class="pill" id="sPos"></div></div><button class="back" id="minimize">⌄</button></div><div class="timer" id="timer">00:00</div><div class="studybox"><label style="margin-top:0">今、何を勉強していますか？</label><textarea id="liveContent" placeholder="内容は途中で変えてOK。ここに具体的に残します。"></textarea><button class="ghost" id="saveContent">内容を保存</button></div><div class="events"><button class="event" data-event="gotit"><b>💡</b>Got it<div class="count" id="c-gotit"></div></button><button class="event" data-event="confused"><b>?</b>Hmm<div class="count" id="c-confused"></div></button><button class="event" data-event="important"><b>★</b>Keep<div class="count" id="c-important"></div></button><button class="event" data-event="revisit"><b>↩</b>Later<div class="count" id="c-revisit"></div></button></div><button class="secondary" id="finishBtn" style="margin-top:22px">■ Finish</button></section>
<section id="finish" class="hidden"><div class="small">SESSION COMPLETE</div><h2 id="fTitle"></h2><div class="card"><div class="small">WHAT CHANGED</div><div class="insight" id="signal"></div><div class="small" id="fTime" style="margin-top:9px"></div></div><label>どこまで進んだ？ <span class="small">任意</span></label><input id="fPos"><label>一言だけ残す <span class="small">任意</span></label><textarea id="fOutcome" rows="3" placeholder="分かったこと／まだ曖昧なこと"></textarea><button class="primary" id="doneBtn" style="margin-top:20px">Done</button></section>
<section id="today" class="hidden"><button class="back" data-home>← Back</button><div class="small">TODAY</div><h2>What changed?</h2><div id="todayList" class="timeline card"></div></section>
<section id="patterns" class="hidden"><button class="back" data-home>← Back</button><div class="small">QUIET INTELLIGENCE</div><h2>Learning OS notices</h2><div id="patternList"></div></section><div class="toast" id="toast"></div></div>
<script>(()=>{const KEY='learningOS_pwa_v1',ACTIVE='learningOS_active_pwa_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"topics":{},"sessions":[]}');let active=JSON.parse(localStorage.getItem(ACTIVE)||'null'),tick=null,pendingTopic='';const $=id=>document.getElementById(id),sections=['home','new','session','finish','today','patterns'];const screen=id=>sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));const saveActive=()=>active?localStorage.setItem(ACTIVE,JSON.stringify(active)):localStorage.removeItem(ACTIVE);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),700)}function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const h=d.getHours();$('greet').textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}setInterval(clock,1000);clock();function fmt(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`}function counts(s=active){const c={gotit:0,confused:0,important:0,revisit:0};(s?.events||[]).forEach(e=>c[e.type]++);return c}function todays(){const k=new Date().toDateString();return data.sessions.filter(s=>new Date(s.start).toDateString()===k)}function renderHome(){$('activeBox').innerHTML=active?`<div class="card tap" id="resumeCard"><div class="topline"><div><div class="small">IN PROGRESS</div><div class="topic">${esc(active.topic)}</div><div class="small">${esc(active.content||'Learning')}</div></div><div>▶</div></div></div>`:'';if(active)$('resumeCard').onclick=resume;const box=$('topicList');box.innerHTML='';const ts=Object.values(data.topics).sort((a,b)=>b.updated-a.updated).slice(0,6);if(!ts.length)box.innerHTML='<div class="card muted">下の欄に学びたいことを入れて始めます。</div>';ts.forEach(t=>{const e=document.createElement('div');e.className='card tap';e.innerHTML=`<div class="topline"><div><div class="topic">${esc(t.topic)}</div><div class="small">${esc(t.lastContent||'Tap to continue')}${t.position?' · '+esc(t.position):''}</div></div><div>▶</div></div>`;e.onclick=()=>begin(t.topic,t.lastContent||'',t.position||'');box.appendChild(e)});const a=todays();$('todaySummary').textContent=a.length?`${a.length} moments · ${Math.round(a.reduce((x,s)=>x+s.duration,0)/60)} min`:'Nothing yet.'}function home(){clearInterval(tick);screen('home');renderHome()}function begin(topic,content='',position=''){active={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),topic,content,position,start:Date.now(),events:[]};saveActive();resume()}function resume(){$('sTopic').textContent=active.topic;$('sHeading').textContent=active.content?active.content.slice(0,45):'Learning';$('sPos').textContent=active.position||'In progress';$('liveContent').value=active.content||'';screen('session');clearInterval(tick);tick=setInterval(()=>{$('timer').textContent=fmt(Math.floor((Date.now()-active.start)/1000))},1000);$('timer').textContent=fmt(Math.floor((Date.now()-active.start)/1000));renderCounts()}function renderCounts(){const c=counts();Object.keys(c).forEach(k=>$('c-'+k).textContent=c[k]||'')}function saveContent(){active.content=$('liveContent').value.trim();$('sHeading').textContent=active.content?active.content.slice(0,45):'Learning';saveActive();toast('内容を保存')}function addEvent(type){active.events.push({type,time:Date.now()});saveActive();renderCounts();toast(type==='gotit'?'💡':type==='confused'?'?':type==='important'?'★':'↩')}function finish(){clearInterval(tick);active.content=$('liveContent').value.trim();active.duration=Math.max(1,Math.round((Date.now()-active.start)/1000));saveActive();const c=counts();let msg='今日の学習が記録されました。';if(c.confused&&c.gotit)msg='「分からない」から「分かった」への変化がありました。';else if(c.gotit)msg='理解できた瞬間がありました。';else if(c.confused)msg='まだ曖昧な場所が見つかりました。';else if(c.revisit)msg='戻るべき場所を見つけました。';$('fTitle').textContent=active.topic;$('signal').textContent=msg;$('fTime').textContent=Math.max(1,Math.round(active.duration/60))+' min';$('fPos').value=active.position||'';$('fOutcome').value='';screen('finish')}function done(){active.end=Date.now();active.endPosition=$('fPos').value.trim();active.outcome=$('fOutcome').value.trim();data.sessions.push(active);data.topics[active.topic]={topic:active.topic,lastContent:active.content,position:active.endPosition||active.position,updated:Date.now()};save();active=null;saveActive();home();toast('Remembered')}function showToday(){const box=$('todayList'),arr=todays().slice().reverse();box.innerHTML=arr.length?'':'<div class="muted">No moments yet.</div>';arr.forEach(s=>{const c=counts(s),sig=c.confused&&c.gotit?'? → 💡':c.gotit?'💡':c.confused?'?':c.important?'★':c.revisit?'↩':'';box.innerHTML+=`<div class="item"><b>${esc(s.topic)}</b><div>${esc(s.content||'')}</div><div class="small">${Math.max(1,Math.round(s.duration/60))} min ${sig?'· '+sig:''}</div>${s.outcome?`<div style="margin-top:6px">${esc(s.outcome)}</div>`:''}</div>`});screen('today')}function showPatterns(){const box=$('patternList'),ss=data.sessions;box.innerHTML='';if(!ss.length){box.innerHTML='<div class="card muted">使うほど、ここに学習傾向が現れます。</div>';return screen('patterns')}let by={},hours={},c={gotit:0,confused:0,important:0,revisit:0};ss.forEach(s=>{by[s.topic]=(by[s.topic]||0)+s.duration;const h=new Date(s.start).getHours(),p=h<12?'morning':h<18?'afternoon':'evening';hours[p]=(hours[p]||0)+1;s.events.forEach(e=>c[e.type]++)});const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0],peak=Object.entries(hours).sort((a,b)=>b[1]-a[1])[0];[['Most explored',`${top[0]} · ${Math.round(top[1]/60)} min`],['Rhythm',`${peak[0]} is your most common start time.`],['Signals',`💡 ${c.gotit} · ? ${c.confused} · ★ ${c.important} · ↩ ${c.revisit}`],['Threads',`${Object.keys(data.topics).length} learning threads remembered.`]].forEach(([a,b])=>box.innerHTML+=`<div class="card"><div class="small">${a.toUpperCase()}</div><div class="insight">${esc(b)}</div></div>`);screen('patterns')}$('quickAdd').onclick=()=>{const t=$('quickTopic').value.trim();if(!t)return;pendingTopic=t;$('newTitle').textContent=t;$('newContent').value='';$('newPosition').value='';screen('new')};$('quickTopic').addEventListener('keydown',e=>{if(e.key==='Enter')$('quickAdd').click()});$('startNew').onclick=()=>begin(pendingTopic,$('newContent').value.trim(),$('newPosition').value.trim());$('saveContent').onclick=saveContent;$('minimize').onclick=()=>{saveContent();home()};$('finishBtn').onclick=finish;$('doneBtn').onclick=done;$('todayCard').onclick=showToday;$('patternsBtn').onclick=showPatterns;document.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>addEvent(b.dataset.event));renderHome();if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}})();</script></body></html>
